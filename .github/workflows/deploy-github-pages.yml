name: Deploy Arvostra to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies (Linux-safe)
        run: npm install --no-audit --no-fund

      - name: Build Vite static site
        env:
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || 'rahuladepu99@gmail.com' }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY || '' }}
          VITE_FORMSPREE_ENDPOINT: ${{ vars.VITE_FORMSPREE_ENDPOINT || '' }}
          VITE_INQUIRY_WEBHOOK_URL: ${{ secrets.VITE_INQUIRY_WEBHOOK_URL || '' }}
        run: npm run build

      - name: Verify built dist/ output and optional CNAME
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}
        run: |
          test -f dist/index.html
          test -d dist/assets
          touch dist/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "$CUSTOM_DOMAIN" > dist/CNAME
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
