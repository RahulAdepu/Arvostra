<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arvostra Forms Registration</title>
  </head>
  <body>
    <!-- Static form blueprint detected automatically by Netlify Forms at deploy time -->
    <form
      name="arvostra-inquiry"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="arvostra-inquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="referenceId" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="serviceCategory" />
      <input type="text" name="selectedDemo" />
      <input type="text" name="whatsapp" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <input type="text" name="existingWebsite" />
      <input type="text" name="referenceUrls" />
      <textarea name="description"></textarea>
      <textarea name="additionalRequirements"></textarea>
    </form>

    <form
      name="arvostra-feedback"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="arvostra-feedback" />
      <input type="text" name="bot-field" />
      <input type="text" name="referenceId" />
      <input type="text" name="type" />
      <input type="text" name="area" />
      <input type="text" name="severity" />
      <input type="email" name="email" />
      <input type="text" name="techContext" />
      <textarea name="details"></textarea>
    </form>
  </body>
</html>
