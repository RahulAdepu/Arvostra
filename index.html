<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ee" />

    <title>Arvostra — Practical Software, AI &amp; Cloud Systems</title>
    <meta
      name="description"
      content="Arvostra is a minimalist digital studio &amp; technology solutions marketplace founded by Rahul Adepu. Fast websites, AI workflow automation, cloud infrastructure, and ready-to-deploy demos."
    />
    <meta
      name="keywords"
      content="Arvostra, Rahul Adepu, Digital Studio, Web Development, AI Workflow Automation, Cloud Infrastructure, DevOps Consulting, Website Templates, Toronto Software Studio"
    />
    <meta name="author" content="Rahul Adepu" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arvostra" />
    <meta property="og:url" content="https://arvostra.com/" />
    <meta
      property="og:title"
      content="Arvostra — Practical Software, AI &amp; Cloud Systems"
    />
    <meta
      property="og:description"
      content="Minimalist digital studio &amp; technology solutions marketplace. Explore live demos, customizable templates, AI integrations, and reliable cloud engineering."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Arvostra — Practical Software, AI &amp; Cloud Systems"
    />
    <meta
      name="twitter:description"
      content="Fast websites, intelligent workflows, ready-to-deploy demos, and reliable cloud infrastructure."
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://arvostra.com/#organization",
            "name": "Arvostra",
            "url": "https://arvostra.com",
            "email": "mailto:rahuladepu99@gmail.com",
            "description": "Minimalist Digital Studio & Technology Solutions Marketplace",
            "founder": {
              "@type": "Person",
              "name": "Rahul Adepu",
              "email": "mailto:rahuladepu99@gmail.com",
              "sameAs": [
                "https://www.linkedin.com/in/Rahul-Adepu-614603151",
                "https://github.com/RahulAdepu"
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://arvostra.com/#website",
            "url": "https://arvostra.com",
            "name": "Arvostra",
            "publisher": { "@id": "https://arvostra.com/#organization" }
          }
        ]
      }
    </script>

    <!-- Default to light mode; only switch to dark if user explicitly chose dark -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("arvostra_theme");
          var theme = saved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "dark" ? "#0a1b1e" : "#f5f4ee"
            );
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
